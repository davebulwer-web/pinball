<title>Pixel Pinball</title>
<meta name="theme-color" content="#0b0614">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* The table menu: a neon sign over a row of pinball cabinets (the same night-time arcade look as the
     Fruit Machine Arcade). Picking one hides the menu and starts the table full screen. */
  :root {
    --night: #0b0614; --ink: #f4ead8; --dim: #b8a8c8; --neon: #ff3fae; --neon-2: #3fd6ff; --gold: #ffc940;
    --cabinet: #1c1028; --cabinet-edge: #3a2450; --bezel: #07040c;
    --display: 'Press Start 2P', 'Courier New', monospace; --body: 'VT323', ui-monospace, 'Courier New', monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #2a1240 0%, var(--night) 60%) fixed, var(--night); color: var(--ink);
    font: 22px/1.25 var(--body); box-sizing: border-box; overflow: hidden;
  }
  body.playing { background: #000; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #lobby { height: 100%; overflow-y: auto; box-sizing: border-box; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 28px; }

  header { text-align: center; display: grid; gap: 14px; justify-items: center; }
  .sign {
    font: 26px/1.5 var(--display); color: #ffe6f6; letter-spacing: 2px; margin: 0; text-wrap: balance;
    padding: 14px 20px; border: 3px solid var(--neon); border-radius: 10px;
    text-shadow: 0 0 4px #fff, 0 0 10px var(--neon), 0 0 22px var(--neon);
    box-shadow: 0 0 10px var(--neon), inset 0 0 12px #ff3fae66; animation: hum 6s infinite;
  }
  .sign span { color: #e6fbff; text-shadow: 0 0 4px #fff, 0 0 10px var(--neon-2), 0 0 22px var(--neon-2); }
  .strap { font: 11px/1.6 var(--display); color: var(--gold); letter-spacing: 1px; margin: 0; text-shadow: 0 0 8px #ffc94066; }
  @keyframes hum { 0%, 92%, 100% { opacity: 1 } 93% { opacity: .55 } 94% { opacity: 1 } 96% { opacity: .7 } }

  ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 280px)); gap: 28px; justify-content: center; }
  li { width: 100%; max-width: 280px; min-width: 0; }
  .cabinet {
    --accent: var(--neon); width: 100%; display: grid; padding: 0; cursor: pointer; text-align: center; color: var(--ink);
    background: var(--cabinet); border: 3px solid var(--cabinet-edge); border-radius: 14px 14px 6px 6px; font: inherit;
    box-shadow: 0 10px 0 #05020a, 0 0 0 1px #000; transition: transform .15s ease, box-shadow .15s ease;
  }
  .cabinet:hover, .cabinet:focus-visible { transform: translateY(-4px); box-shadow: 0 14px 0 #05020a, 0 0 22px var(--accent); outline: none; }
  .cabinet:focus-visible { border-color: var(--accent); }
  .marquee { font: 13px/1.4 var(--display); padding: 12px 8px; border-radius: 10px 10px 0 0; color: #fff; background: linear-gradient(180deg, #ffffff22, #00000033), var(--accent); text-shadow: 2px 2px 0 #00000088; letter-spacing: 1px; }
  .screen { background: var(--bezel); padding: 10px; border-block: 3px solid #000; }
  .screen img, .screen .blank { display: block; width: 100%; aspect-ratio: 320 / 560; image-rendering: pixelated; border-radius: 4px; box-shadow: 0 0 0 2px #000, 0 0 16px #00000099; }
  .screen .blank { background: repeating-linear-gradient(45deg, #141a33 0 8px, #10142a 8px 16px); }
  .plinth { display: grid; gap: 8px; padding: 12px 14px 16px; }
  .tag { font-size: 20px; text-wrap: balance; }
  .meta { font-size: 18px; color: var(--dim); letter-spacing: .5px; }
  .meta b { font-weight: normal; color: var(--gold); }
  .play { justify-self: center; display: inline-flex; align-items: center; gap: 10px; margin-top: 4px; font: 11px/1 var(--display); color: #101010; background: var(--gold); padding: 10px 14px; border-radius: 4px; box-shadow: 0 3px 0 #8a6010; }
  .play::before { content: ""; width: 4px; height: 14px; background: #101010; border-radius: 2px; }
  .cabinet:hover .play { background: #fff0b0; }

  .workshop { display: grid; gap: 10px; justify-items: center; }
  .workshop h2 { font: 10px/1.6 var(--display); color: var(--dim); margin: 0; letter-spacing: 1px; }
  .workshop div { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .workshop button, .arcade-link {
    font: 18px/1 var(--body); color: var(--dim); background: var(--cabinet); border: 2px solid var(--cabinet-edge);
    border-radius: 4px; padding: 8px 12px; cursor: pointer; text-decoration: none;
  }
  .workshop button:hover, .workshop button:focus-visible, .arcade-link:hover, .arcade-link:focus-visible { color: var(--gold); border-color: var(--gold); outline: none; }
  .arcade-link { justify-self: center; font: 10px/1.4 var(--display); color: var(--neon-2); border-color: #1f5566; padding: 12px 16px; }
  .note { text-align: center; color: var(--dim); font-size: 19px; margin: 0; }
  .note b { font-weight: normal; color: var(--gold); }

  #stage { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; outline: none; display: block; }
  @media (max-width: 520px) {
    body { font-size: 20px; }
    .sign { font-size: 17px; padding: 10px 12px; }
    ul { gap: 16px; }
    .marquee { font-size: 10px; padding: 10px 4px; }
    .tag { font-size: 17px; } .meta { font-size: 16px; }
    .play { font-size: 9px; padding: 8px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .sign { animation: none; } .cabinet { transition: none; } }
  [hidden] { display: none !important; }
</style>
