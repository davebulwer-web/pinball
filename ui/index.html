<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title><!--TITLE--></title>
<style>
  :root { --bg: #000; --fg: #8a8f9a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; outline: none; display: block; }
  #help { position: fixed; right: 16px; bottom: 16px; color: var(--fg); font: 12px/1.6 system-ui, sans-serif; text-align: right; }
  @media (max-aspect-ratio: 4/3) { #help { display: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="320" height="480" tabindex="0"></canvas></div>
<div id="help">Players: 1 to 4 · Menu: Esc<br>Flippers: Z and / (or Shift)<br>Launch: hold Space, release<br>Nudge: arrow keys<br>Rules H · Pause P · Sound M · Debug D</div>
<!--ART-->
<!--SCRIPT-->
</body>
</html>
